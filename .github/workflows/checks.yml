name: CAUSYN offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.runtime.txt
      - run: python deployment_checks.py
      - run: python free_hosting_checks.py
      - run: python guided_checks.py
      - run: python answer_completeness_checks.py
      - run: python presentation_checks.py
      - run: node presentation_checks.js
      - run: python evaluate_depth.py --self-test
      - run: python verification.py --self-test
      - run: python sql_specialist.py --self-test
      - run: python python_specialist.py --self-test
      - run: python document_specialist.py --self-test
      - run: python visualization_specialist.py --self-test
      - run: python verifier_specialist.py --self-test
      - run: docker build -t causyn:check .
